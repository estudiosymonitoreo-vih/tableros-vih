<template id="metodologia-casos">
  <p>La evolución compara diagnósticos de VIH por año de diagnóstico. Podés elegir casos o tasas y combinar varias geografías, sexos y edades. Cada serie conserva su propio valor. El n total cuenta una sola vez los casos incluidos en selecciones superpuestas.</p>
  <p>Las tasas dividen los diagnósticos por la población del mismo año, territorio, sexo y grupo etario, y se expresan por 100.000 habitantes. El mapa y el ranking provincial tienen sus propios filtros y muestran el año seleccionado.</p>
  <p class="nota">Fuente de casos: SNVS / SISA. Los conteos pueden actualizarse por retrasos de notificación.</p>
</template>
<template id="metodologia-geografia">
  <p>Las barras apiladas muestran cómo se distribuyen los diagnósticos de VIH entre regiones en cada año. El mapa y el ranking muestran el porcentaje correspondiente a cada provincia en el año seleccionado, sobre los diagnósticos con provincia de residencia conocida.</p>
  <p>Los filtros de género y grupo de edad se aplican a ambas vistas. El selector de año se aplica al mapa y al ranking. En esta distribución, GBA comprende CABA y 24 partidos bonaerenses. Centro comprende el resto de Buenos Aires, Córdoba, Santa Fe y Entre Ríos.</p>
  <p class="nota">Fuente: SNVS / SISA.</p>
</template>
<template id="metodologia-genero">
  <p>La solapa muestra la distribución de diagnósticos de VIH por género y edad y su evolución. La geografía se comparte. El grupo de edad filtra los gráficos de género, y el género filtra los gráficos de edad.</p>
  <p>La razón varones/mujeres divide los diagnósticos de varones por los de mujeres. La mediana se calcula a partir de las edades individuales y representa el punto que divide los diagnósticos con edad informada en dos mitades.</p>
  <p class="nota">Fuente: SNVS / SISA. El género registrado en esta solapa es una variable distinta del sexo usado para las tasas poblacionales.</p>
</template>
<template id="metodologia-vias">
  <p>El gráfico circular muestra la distribución de las vías de transmisión informadas en los diagnósticos de VIH de 2025, según la geografía, el género y la edad elegidos.</p>
  <p>Al seleccionar varones, aparece la comparación por grupo de edad. Cada barra representa el 100 % de las vías informadas en ese grupo para el año seleccionado. El n indica los diagnósticos incluidos en el cálculo.</p>
  <p class="nota">Fuente: SNVS / SISA.</p>
</template>
<template id="metodologia-diagnostico">
  <p>Los porcentajes de diagnóstico tardío y enfermedad avanzada se calculan sobre los casos con dato de oportunidad diagnóstica. La enfermedad avanzada está incluida en el diagnóstico tardío.</p>
  <p>La evolución y las comparaciones por edad, género y vía de transmisión usan los bienios 2022–2023 y 2024–2025. Los porcentajes se calculan después de sumar los casos y denominadores de cada bienio.</p>
  <p>Se muestra el porcentaje cuando al menos el 60 % de los casos del grupo tiene dato de oportunidad diagnóstica. El n indica cuántos casos tienen ese dato.</p>
  <p class="nota">Fuente: SNVS / SISA.</p>
</template>
<template id="metodologia-mapas-diagnostico">
  <p>Los dos mapas muestran diagnóstico tardío y enfermedad avanzada por jurisdicción para el bienio, género y grupo de edad seleccionados. La enfermedad avanzada es parte del diagnóstico tardío. Ambos porcentajes se calculan sobre los casos con dato de oportunidad diagnóstica de todo el bienio.</p>
  <p>Se muestra el valor cuando al menos el 55 % de los casos del grupo tiene dato. Las jurisdicciones por debajo del umbral se indican en gris.</p>
  <p>Al elegir una región se amplía el detalle territorial. GBA comprende CABA y 24 partidos bonaerenses. Centro incluye el resto de Buenos Aires, Córdoba, Santa Fe y Entre Ríos.</p>
  <p class="nota">Fuente: SNVS / SISA.</p>
</template>
<template id="metodologia-mortalidad">
  <p>La solapa reúne las defunciones por sida y las tasas de mortalidad por 100.000 habitantes. La tasa bruta divide las defunciones por la población correspondiente. La tasa ajustada por edad combina las tasas específicas usando una población estándar.</p>
  <p>La tabla resume 2020–2024. El mapa y la comparación provincial muestran 2024. Los gráficos por edad muestran las tasas y qué proporción de las defunciones corresponde a cada grupo.</p>
  <p class="nota">Fuente: DEIS / Ministerio de Salud de la Nación. Boletín N.º 43 de Respuesta al VIH y las ITS en Argentina y tablas de defunciones del tablero.</p>
</template>
<template id="metodologia-sifilis">
  <p>La evolución, el mapa provincial y las comparaciones muestran diagnósticos notificados de sífilis. Las tasas dividen los casos por las proyecciones de población del INDEC para el año, la geografía, el sexo y la edad correspondientes, y se expresan por 100.000 habitantes.</p>
  <p>La evolución recorre todos los años. El mapa y la comparación regional usan el año y el grupo de edad seleccionados y siempre muestran el país completo. La comparación por edad muestra todos los grupos visibles del año elegido. La dona muestra la distribución por sexo registrado.</p>
  <p>«Todas las edades» incluye los diagnósticos desde los 10 años y los de edad sin especificar. Su tasa usa la población de 10 años o más. «Ambos sexos» incluye los diagnósticos sin sexo informado. Las barras de edad individuales empiezan en 15–19. Centro reúne CABA, Buenos Aires, Córdoba, Entre Ríos y Santa Fe. El total de Argentina incluye casos sin jurisdicción informada.</p>
  <p class="nota">Fuente de casos: SNVS. Las tasas de sífilis empiezan en 2022 y usan la serie poblacional del INDEC basada en el Censo 2022.</p>
</template>
<template id="metodologia-sifilis-territorio">
  <p>Se muestran muestras de tamizaje de sífilis en población general y en personas gestantes. Para gestantes se suman las muestras del primer control y de controles sin especificar antes de calcular los indicadores.</p>
  <p>La positividad es el número de muestras positivas dividido por el de muestras estudiadas, multiplicado por 100. Las barras de casos separan las muestras positivas y negativas. Para calcular resultados nacionales o regionales se suman los conteos provinciales antes de dividir.</p>
  <p>El grupo de edad filtra las evoluciones. El año filtra las comparaciones por edad. «Todas las edades» incluye a menores de 10 años y muestras sin edad especificada. En gestantes, los grupos a partir de 65 años figuran en el total de todas las edades.</p>
  <p class="nota">Fuente: SNVS / SISA, reporte SNVS004, semanas epidemiológicas 1–53.</p>
</template>
<template id="metodologia-sifilis-coinfeccion">
  <p>Se cuentan los registros con un diagnóstico de VIH y uno de sífilis en el mismo año calendario. La proporción divide esos registros por todos los diagnósticos de VIH del mismo grupo y año. El segmento sin coinfección registrada es la diferencia entre ambos conteos.</p>
  <p>La comparación por edad usa la edad registrada en el archivo de coinfección, que no especifica a cuál de los diagnósticos corresponde. El total nacional incluye registros sin provincia informada. Centro incluye CABA, Buenos Aires, Córdoba, Entre Ríos y Santa Fe.</p>
  <p>«Todas las edades» y «Ambos sexos» incluyen respectivamente los registros sin edad o sin sexo informado.</p>
  <p>Cuando el recuento de coinfecciones supera el total de VIH del grupo, se omite la barra y la proporción de esa categoría. Los conteos quedan disponibles en «Ver datos».</p>
</template>
<template id="metodologia-resumen">
  <p>Las tarjetas muestran 2025 o, cuando falta ese dato, 2024. Diagnóstico tardío y enfermedad avanzada usan 2024–2025, con 2022–2023 como bienio de comparación. Las líneas anuales muestran hasta cinco años. La referencia nacional corresponde al mismo período que el valor territorial.</p>
  <p>El mapa muestra valores por provincia. Las vías de transmisión se calculan a partir de los conteos por género disponibles en el tablero e incluyen las vías desconocidas en el denominador.</p>
</template>

<template id="metodologia-empalme">
  <p>El empalme poblacional se hace entre 2021 y 2022. Hasta 2021 se usan las proyecciones basadas en el Censo 2010. Desde 2022 se usan las estimaciones y proyecciones basadas en el Censo 2022. Cada tasa usa el denominador de su año. El cambio de base poblacional puede influir en la variación de la tasa entre esos dos años.</p>
  <p class="fuentes-metodologia"><a href="https://www.indec.gob.ar/ftp/cuadros/publicaciones/proyecciones_prov_2010_2040.pdf" target="_blank" rel="noopener">INDEC · Proyecciones provinciales de población por sexo y grupo de edad, 2010–2040 (Censo 2010)</a></p>
