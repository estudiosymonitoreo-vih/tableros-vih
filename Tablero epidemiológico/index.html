<template id="metodologia"><p>Los filtros seleccionan agregados ya calculados por el procesamiento SNVS. Las tasas se expresan por 100.000 habitantes. En el primer gráfico se comparan series: seleccionar Argentina y provincias no suma sus valores. El indicador permite elegir casos o tasas; los otros tres filtros de ese gráfico admiten selección múltiple.</p><p>Los porcentajes usan los denominadores de cada fuente. Diagnóstico tardío incluye enfermedad avanzada, que es su subconjunto: no se deben sumar. El denominador son los casos con información de oportunidad diagnóstica. Sin denominador válido se muestra «Sin datos», sin convertirlo en cero. Los mapas comparan las 24 jurisdicciones. Las tarjetas de la primera página resumen la selección de la evolución; las de los mapas de diagnóstico tardío resumen Argentina para el género, la edad y el año elegidos. No se calculan variaciones interanuales porque los datos pueden actualizarse por retrasos de notificación.</p><p>Sexo, utilizado para tasas poblacionales, y género, utilizado para caracterización, son dimensiones diferentes. Las medianas provienen de edades individuales; no se promedian medianas de subgrupos. La fecha al pie corresponde a la exportación de la base, cuando está identificada en sus metadatos o en la fuente del análisis, y no a la hora de generar el HTML.</p><p>Cartografía: Natural Earth, dominio público. <a href="FUENTES.md">Fuentes cartográficas</a> · <a href="LICENCIA.md">Licencia</a>.</p></template>
